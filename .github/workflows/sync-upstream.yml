name: Sync Upstream & Sub-branches

on:
  schedule:
    # 每天 UTC 02:00 (北京时间 10:00) 执行
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: cmliu/edgetunnel
  UPSTREAM_BRANCH: main
  # 需要跟随 main 更新的子分支（每个分支自己保留 wrangler.toml 里的 worker 名称与 KV 绑定）
  SUB_BRANCHES: >-
    update_worker_name_to_dkjsjfkd
    update_worker_name_to_edgetunnel
    update_worker_name_to_lei666
    update_worker_name_to_ligen
    wushi-edgetunnel

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream ${{ env.UPSTREAM_BRANCH }}

      - name: Sync Main
        run: |
          git merge upstream/${{ env.UPSTREAM_BRANCH }} --no-edit
          git push origin main

      - name: Sync Sub-branches
        run: |
          UPDATED=0
          SKIPPED=0

          for BRANCH in ${{ env.SUB_BRANCHES }}; do
            echo ""
            echo "=== 同步分支: $BRANCH ==="

            # 确保远端分支存在
            if ! git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
              echo "远端分支 $BRANCH 不存在，跳过"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # 切到子分支
            git checkout "$BRANCH"

            # 备份该分支的 wrangler.toml（每个 worker 自己的名称与 KV 绑定都在这里）
            if [ -f wrangler.toml ]; then
              cp wrangler.toml /tmp/wrangler_branch.toml
            else
              : > /tmp/wrangler_branch.toml
            fi

            # 用 main 的内容覆盖分支；.github/workflows 保持原样，避免推送工作流文件被 GitHub 拒绝
            git checkout main -- . ':(exclude).github/workflows'

            # 只把自己那份 worker 名称 / KV 绑定放回来，其余（版本号、兼容日期等）跟随 main
            python3 - <<'PY'
          import pathlib, re

          branch_path = pathlib.Path('/tmp/wrangler_branch.toml')
          target = pathlib.Path('wrangler.toml')

          branch_txt = branch_path.read_text(encoding='utf-8') if branch_path.exists() else ''
          main_txt = target.read_text(encoding='utf-8')


          def kv_sections(text):
              """取出未注释的 [[kv_namespaces]] 段落"""
              blocks, cur = [], None
              for line in text.splitlines():
                  if re.match(r'^\s*\[\[kv_namespaces\]\]', line):
                      cur = [line]
                      blocks.append(cur)
                      continue
                  if cur is not None:
                      if re.match(r'^\s*\[', line):
                          cur = None
                      else:
                          cur.append(line)
              result = []
              for block in blocks:
                  while block and not block[-1].strip():
                      block.pop()
                  if block:
                      result.append(block)
              return result


          def without_kv(text):
              """去掉 main 里的 KV 注释模板，以及可能存在的 [[kv_namespaces]] 段落"""
              out, skipping = [], False
              for line in text.splitlines():
                  if re.match(r'^\s*\[\[kv_namespaces\]\]', line):
                      skipping = True
                      continue
                  if skipping:
                      if re.match(r'^\s*\[', line):
                          skipping = False
                      else:
                          continue
                  if re.match(r'^\s*#\s*(\[\[kv_namespaces\]\]|binding\s*=|id\s*=)', line):
                      continue
                  out.append(line)
              return '\n'.join(out).rstrip('\n')


          merged = main_txt

          # 1) worker 名称：自定义名称保留；上游的版本号（如 v20251104）跟着 main 走
          m = re.search(r'(?m)^\s*name\s*=\s*"([^"]*)"', branch_txt)
          if m:
              branch_name = m.group(1).strip()
              if branch_name and not re.fullmatch(r'v\d{8}', branch_name):
                  merged = re.sub(
                      r'(?m)^(\s*name\s*=\s*)"[^"]*"',
                      lambda mo: '%s"%s"' % (mo.group(1), branch_name),
                      merged,
                      count=1,
                  )

          # 2) KV 绑定：分支里启用了就整段搬回来
          custom_kv = kv_sections(branch_txt)
          if custom_kv:
              merged = without_kv(merged).rstrip('\n')
              merged = merged + '\n\n' + '\n\n'.join('\n'.join(b) for b in custom_kv)

          # 3) 需要固定在分支上的布尔开关（例如 workers_dev = false，用来关闭 workers.dev 公开入口）
          for flag in ('workers_dev', 'preview_urls'):
              m_flag = re.search(r'(?m)^[ \t]*' + flag + r'[ \t]*=[ \t]*(true|false)[ \t]*\r?$', branch_txt)
              if not m_flag:
                  continue
              wanted = '%s = %s' % (flag, m_flag.group(1))
              if re.search(r'(?m)^[ \t]*' + flag + r'[ \t]*=', merged):
                  merged = re.sub(r'(?m)^[ \t]*' + flag + r'[ \t]*=[ \t]*(true|false)[ \t]*\r?$', wanted, merged)
              else:
                  anchor = re.search(r'(?m)^[ \t]*keep_vars[ \t]*=[ \t]*(true|false)[ \t]*\r?$', merged)
                  if anchor:
                      merged = merged[:anchor.end()] + '\n' + wanted + merged[anchor.end():]
                  else:
                      table = re.search(r'(?m)^[ \t]*\[', merged)
                      pos = table.start() if table else len(merged)
                      merged = merged[:pos].rstrip('\n') + '\n' + wanted + '\n\n' + merged[pos:]

          # 保持该分支原有的结尾换行习惯，避免产生无意义的差异
          merged = merged.rstrip('\n') + ('\n' if branch_txt.endswith('\n') else '')

          if merged != main_txt:
              target.write_text(merged, encoding='utf-8')
              print('wrangler.toml: 已保留自定义名称/KV，其余跟随 main')
          else:
              print('wrangler.toml: 无需调整')
          PY

            # 与分支当前提交比较，判断是否有真实改动
            git add -A
            if git diff --cached --quiet; then
              echo "$BRANCH 无需更新（已与 main 一致）"
              SKIPPED=$((SKIPPED + 1))
            else
              git commit -m "sync: 跟随 main 更新（保留自定义 worker 名称、KV 绑定与开关）"
              git push origin "$BRANCH"
              echo "$BRANCH 已同步"
              UPDATED=$((UPDATED + 1))
            fi
          done

          echo ""
          echo "=============================="
          echo "同步完成: 更新 $UPDATED 个分支, 跳过 $SKIPPED 个分支"


      - name: Summary
        if: always()
        run: |
          echo "## 同步结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 各子分支的 worker 名称、KV 绑定与 workers_dev 等开关保持不变" >> $GITHUB_STEP_SUMMARY
          echo "- 其余配置（版本号、兼容日期等）已跟随 main 更新" >> $GITHUB_STEP_SUMMARY
